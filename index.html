<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نتيجة الثانوية العامة 2026</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --text:#16202e; --muted:#68758a;
    --line:#e3e8f0; --brand:#1b6ef3; --ok:#0f9d58; --bad:#d93025;
    --track:#e8eef7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1420; --card:#171e2c; --text:#e8edf5; --muted:#96a3b8;
           --line:#26303f; --brand:#5b9bff; --ok:#3ecf8e; --bad:#ff6b60;
           --track:#26303f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",Tahoma,"Geeza Pro",system-ui,-apple-system,sans-serif;
    line-height:1.6;padding:24px 16px 60px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:1.6rem;margin:0 0 4px;text-align:center}
  .sub{text-align:center;color:var(--muted);margin:0 0 24px;font-size:.9rem}
  .search{display:flex;gap:10px;background:var(--card);padding:10px;
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 4px 20px rgba(0,0,0,.06);position:sticky;top:12px;z-index:5}
  input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);
    font-size:1.05rem;padding:10px 8px;outline:none;font-family:inherit}
  button{border:0;background:var(--brand);color:#fff;font-size:1rem;
    padding:10px 22px;border-radius:10px;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.08)}
  .status{color:var(--muted);font-size:.88rem;margin:18px 4px 10px;min-height:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;display:flex;flex-wrap:wrap;
    align-items:center;gap:8px 18px;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--brand);transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .name{font-weight:600;font-size:1.05rem;flex:1 1 260px}
  .seat{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
  .deg{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
  .pct{color:var(--muted);font-size:.8rem;margin-inline-start:4px}
  .tag{font-size:.8rem;padding:3px 10px;border-radius:999px;
    background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
  .tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
  .hint{text-align:center;color:var(--muted);font-size:.85rem;margin-top:40px}

  /* ---------- شاشة التفاصيل ---------- */
  .overlay{position:fixed;inset:0;background:rgba(9,14,24,.55);
    backdrop-filter:blur(4px);display:none;align-items:flex-start;
    justify-content:center;padding:24px 16px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px;
    overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);
    animation:rise .22s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}

  .head{background:linear-gradient(135deg,#1b6ef3,#0b47a8);color:#fff;
    padding:26px 24px 22px;text-align:center;position:relative}
  .head h2{margin:0;font-size:1.15rem;font-weight:700}
  .head p{margin:4px 0 0;font-size:.82rem;opacity:.85}
  .close{position:absolute;inset-inline-start:14px;top:14px;width:34px;height:34px;
    padding:0;border-radius:50%;background:rgba(255,255,255,.18);font-size:1.2rem;
    line-height:1;display:grid;place-items:center}

  .body{padding:26px 24px 8px;text-align:center}
  .d-name{font-size:1.35rem;font-weight:700;margin:0 0 10px;line-height:1.4}
  .d-seat{display:inline-block;font-size:.85rem;color:var(--muted);
    background:var(--track);border-radius:999px;padding:5px 14px;
    font-variant-numeric:tabular-nums}

  .ring{margin:22px auto 6px;width:180px;height:180px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .mid{position:absolute;inset:0;display:grid;place-content:center;
    text-align:center;gap:2px}
  .ring .big{font-size:2.3rem;font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums}
  .ring .of{font-size:.78rem;color:var(--muted)}
  .d-pct{font-size:1rem;font-weight:600;color:var(--muted);margin:6px 0 0}
  .d-tag{display:inline-block;margin:16px 0 0;font-size:.95rem;font-weight:600;
    padding:8px 22px;border-radius:999px}

  .rows{margin:22px 0 0;border-top:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;
    border-bottom:1px solid var(--line);font-size:.92rem}
  .row span:first-child{color:var(--muted)}
  .row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}

  .acts{display:flex;gap:10px;padding:18px 24px 24px}
  .acts button{flex:1;padding:13px 8px;border-radius:12px;font-weight:600;
    font-size:.95rem}
  .acts .ghost{background:var(--track);color:var(--text)}

  /* ---------- الطباعة / حفظ PDF ---------- */
  @media print{
    body{padding:0;background:#fff}
    .wrap,.acts,.close{display:none !important}
    .overlay{position:static;display:block;padding:0;background:none;
      backdrop-filter:none;overflow:visible}
    .sheet{max-width:100%;box-shadow:none;border-radius:0;animation:none}
    .head{background:#1b6ef3 !important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>نتيجة الثانوية العامة 2026</h1>
  <p class="sub">النظام الحديث — بحث بالاسم أو برقم الجلوس</p>

  <form class="search" id="form">
    <input id="q" autocomplete="off" autofocus
           placeholder="اكتب رقم الجلوس أو اسم الطالب...">
    <button type="submit">بحث</button>
  </form>

  <div class="status" id="status"></div>
  <div id="results"></div>
  <p class="hint">اضغط على أي نتيجة لعرض التفاصيل وتحميلها — الدرجة الكلية من ٣٢٠</p>
</div>

<!-- شاشة التفاصيل -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dName">
  <div class="sheet">
    <div class="head">
      <button class="close" id="close" aria-label="إغلاق">✕</button>
      <h2>نتيجة الثانوية العامة 2026</h2>
      <p>النظام الحديث — جمهورية مصر العربية</p>
    </div>
    <div class="body">
      <p class="d-name" id="dName"></p>
      <span class="d-seat" id="dSeat"></span>

      <div class="ring">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="76" fill="none"
                  stroke="var(--track)" stroke-width="16"/>
          <circle id="dArc" cx="90" cy="90" r="76" fill="none"
                  stroke="var(--ok)" stroke-width="16" stroke-linecap="round"
                  stroke-dasharray="477.5" stroke-dashoffset="477.5"/>
        </svg>
        <div class="mid">
          <div class="big" id="dTotal">—</div>
          <div class="of">من ٣٢٠</div>
        </div>
      </div>
      <p class="d-pct" id="dPct"></p>
      <div><span class="d-tag" id="dTag"></span></div>

      <div class="rows">
        <div class="row"><span>رقم الجلوس</span><span id="rSeat"></span></div>
        <div class="row"><span>المجموع الكلي</span><span id="rTotal"></span></div>
        <div class="row"><span>النسبة المئوية</span><span id="rPct"></span></div>
        <div class="row"><span>الحالة</span><span id="rStatus"></span></div>
      </div>
    </div>
    <div class="acts">
      <button id="png">⬇︎ تحميل صورة</button>
      <button id="pdf" class="ghost">🖨 حفظ PDF</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script id="backend">
/* مصدر البيانات: الخادم المحلي */
initApp(async q =>
  await (await fetch('/api/search?q=' + encodeURIComponent(q))).json());
</script>
</body>
</html>
